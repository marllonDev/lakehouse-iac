# Credentials are never stored here. DATABRICKS_HOST and DATABRICKS_HTTP_PATH
# come from scripts/env.sh; the OAuth token is managed by the Databricks CLI.
lakehouse:
  target: dev
  outputs:
    dev:
      type: databricks
      # The Databricks CLI and Terraform want the scheme; dbt-databricks wants a
      # bare hostname, so strip it here rather than keeping two env vars in sync.
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      catalog: "{{ env_var('DBT_CATALOG', 'dev_lakehouse') }}"
      schema: staging
      auth_type: oauth
      threads: 4
