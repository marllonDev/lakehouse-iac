name: lakehouse
version: "1.0.0"
config-version: 2

profile: lakehouse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  lakehouse:
    # Terraform creates the schemas; dbt only creates relations inside them.
    # generate_schema_name is overridden in macros/ so these map to the bare
    # schema names rather than dbt's default "<target_schema>_<custom>" form.
    staging:
      +schema: staging
      +materialized: view
    # Intermediate models are views in the staging schema: real relations, so the
    # lineage graph shows them, without a third schema to provision.
    intermediate:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
