version: 2

models:
  - name: st_wikipedia_edits
    description: >
      Raw Wikimedia recent-change events, landed as files in a Unity Catalog
      volume by the ingestion task and read incrementally by Auto Loader.
      This is a streaming table: each refresh consumes only files that arrived
      since the previous one.
    columns:
      - name: event_uuid
        description: Wikimedia's event UUID. Unique across every wiki and event type.
        data_tests: [unique, not_null]
      - name: recent_change_id
        description: >
          The recent-change id. Null on most log events, so it is carried for
          reference but never used as a key.
      - name: edited_at
        data_tests: [not_null]
      - name: wiki_code
        data_tests: [not_null]
      - name: change_type
        description: edit, new, log, or categorize.
      - name: source_file
        description: The landing file this row came from. Makes ingestion auditable.
        data_tests: [not_null]
