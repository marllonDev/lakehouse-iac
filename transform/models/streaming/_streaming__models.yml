version: 2

models:
  - name: st_wikipedia_edits
    description: >
      Raw Wikimedia recent-change events, landed as files in a Unity Catalog
      volume by the ingestion task and read incrementally by Auto Loader.
      This is a streaming table: each refresh consumes only files that arrived
      since the previous one.
    columns:
      - name: event_id
        description: Wikimedia's own event id. Not unique across wikis.
      - name: edited_at
        data_tests: [not_null]
      - name: wiki_code
        data_tests: [not_null]
      - name: change_type
        description: edit, new, log, or categorize.
      - name: source_file
        description: The landing file this row came from. Makes ingestion auditable.
        data_tests: [not_null]
