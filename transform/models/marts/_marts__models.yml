version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension, denormalised with the customer's nation and region so
      that reporting never has to traverse the TPC-H geography tables.
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
      - name: nation_name
        data_tests: [not_null]
      - name: region_name
        data_tests: [not_null]

  - name: fct_orders
    description: >
      One row per order, enriched with aggregates rolled up from its lines.
      Incremental: each run reprocesses a three-day trailing window and merges
      on order_key, so late-arriving lines are picked up without a full rebuild.
    columns:
      - name: order_key
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_customers')
                  field: customer_key
      - name: ordered_at
        data_tests: [not_null]
      - name: line_count
        description: Number of lines on the order. Zero means an order with no lines.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                  min_value: 0
                  inclusive: true

  - name: agg_sales_by_month
    description: Net revenue by order month, customer region, and market segment.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
              combination_of_columns:
                - ordered_at_month
                - region_name
                - market_segment
    columns:
      - name: net_revenue
        data_tests: [not_null]
