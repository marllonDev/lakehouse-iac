version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension, denormalised with the customer's nation and region so
      that reporting never has to traverse the TPC-H geography tables.
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
      - name: nation_name
        data_tests: [not_null]
      - name: region_name
        data_tests: [not_null]

  - name: fct_orders
    description: >
      One row per order, enriched with aggregates rolled up from its lines.
      Incremental: each run reprocesses a three-day trailing window and merges
      on order_key, so late-arriving lines are picked up without a full rebuild.
    columns:
      - name: order_key
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_customers')
                  field: customer_key
      - name: ordered_at
        data_tests: [not_null]
      - name: line_count
        description: Number of lines on the order. Zero means an order with no lines.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                  min_value: 0
                  inclusive: true

  - name: agg_sales_by_month
    description: Net revenue by order month, customer region, and market segment.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
              combination_of_columns:
                - ordered_at_month
                - region_name
                - market_segment
    columns:
      - name: net_revenue
        data_tests: [not_null]

  - name: fct_wikipedia_edits
    description: >
      One row per Wikimedia edit event. Fed by the streaming table, merged
      incrementally on a surrogate key of (wiki, event id). Carries
      ingestion_lag_seconds so pipeline latency is a measurable column rather
      than a claim in a README.
    columns:
      - name: edit_key
        description: The event's Wikimedia UUID (meta.id). Globally unique.
        data_tests: [unique, not_null]
      - name: wiki_code
        data_tests: [not_null]
      - name: edited_at
        data_tests: [not_null]
      - name: ingestion_lag_seconds
        description: Seconds between the edit happening and this pipeline landing it.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                  min_value: -60
                  inclusive: true

  - name: agg_wikipedia_activity
    description: Edit volume, editor counts, and pipeline latency per minute per wiki.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
              combination_of_columns:
                - edited_at_minute
                - wiki_code
    columns:
      - name: edit_count
        data_tests: [not_null]
